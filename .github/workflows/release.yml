name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    # The environment holds NPM_TOKEN and asks Ivan to approve every run.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner is pinned by the commit of conformance/v0.5.0.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: vennet-developers/cauthy-sdk-spec
          ref: bbfe1d0f77fa70b78ca3dc57260fe333ecf773af # conformance/v0.5.0
          path: spec
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: spec/conformance/go.mod
          cache-dependency-path: spec/conformance/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: the tag is the package's version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run typecheck
      - run: npm test
      - name: no version is published without conformance at level switches
        run: npm run conformance
        env:
          SPEC_DIR: ${{ github.workspace }}/spec
          LEVEL: switches
      - name: token vectors, every one must agree
        run: npm run vectors
        env:
          SPEC_DIR: ${{ github.workspace }}/spec
      - run: npm run check:package
      - name: npm that publishes through trusted publishing (OIDC, no token)
        run: npm install -g npm@11.19.1
      - run: npm publish --provenance --access public
