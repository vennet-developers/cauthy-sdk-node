name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:fixtures

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The runner is pinned by the commit of conformance/v0.4.0. It has no
      # --key-env yet, so the target runs the 1.1 way (MODE: variables). When
      # cauthy-sdk-spec tags the conformance release with the key.* checks,
      # move this pin to it and drop MODE: the target then runs on CAUTHY_KEY.
      - name: cauthy-sdk-spec, pinned
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: vennet-developers/cauthy-sdk-spec
          ref: a9e45d986efc006b522d3f1aa8ca0f5e644b7964 # conformance/v0.4.0
          path: spec
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: spec/conformance/go.mod
          cache-dependency-path: spec/conformance/go.sum
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: auth-bff conformance, level switches
        run: npm run conformance
        env:
          SPEC_DIR: ${{ github.workspace }}/spec
          LEVEL: switches
          MODE: variables
          REPORT: ${{ runner.temp }}/conformance-switches.json
      - name: token vectors, every one must agree
        run: npm run vectors
        env:
          SPEC_DIR: ${{ github.workspace }}/spec
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: conformance-switches
          path: ${{ runner.temp }}/conformance-switches.json

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:package
